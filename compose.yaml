name: shopport

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: shopport
      POSTGRES_PASSWORD: shopport
      POSTGRES_USER: shopport
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopport -d shopport"]
      interval: 3s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    profiles: ["full"]
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:9200/_cluster/health >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  localstack:
    image: localstack/localstack:4.3.0
    environment:
      AWS_DEFAULT_REGION: ap-northeast-2
      SERVICES: s3,sqs
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - "./dev/localstack/10-shopport.sh:/etc/localstack/init/ready.d/10-shopport.sh:ro"
      - localstack-data:/var/lib/localstack
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:4566/_localstack/health >/dev/null",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ./shopport-be
      target: runtime
    command: ["node", "dist/scripts/migrate.js"]
    environment: &backend-environment
      APP_ENV: dev
      NODE_ENV: development
      DATABASE_URL: postgresql://shopport:shopport@postgres:5432/shopport
      AWS_REGION: ap-northeast-2
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      ASSET_BUCKET: shopport-assets-raw
      RAW_ASSET_BUCKET: shopport-assets-raw
      NORMALIZED_ASSET_BUCKET: shopport-assets-normalized
      ARCHIVE_BUCKET: shopport-archives
      ASSET_CDN_HOST: localhost
      SQS_ASSET_RESULT_URL: http://localstack:4566/000000000000/shopport-asset-results
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-32-bytes}
      KAKAO_NATIVE_APP_KEY: ${KAKAO_NATIVE_APP_KEY:-local-kakao-key}
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-}
      PROVIDER_MODEL: ${PROVIDER_MODEL:-gpt-5.4-mini}
      PROVIDER_MAX_OUTPUT_TOKENS: ${PROVIDER_MAX_OUTPUT_TOKENS:-512}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./shopport-be
      target: runtime
    environment: *backend-environment
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 30

  worker: &worker
    build:
      context: ./shopport-be
      target: runtime
    command: ["node", "dist/src/worker.js"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

  outbox-worker:
    <<: *worker
    command: ["node", "dist/src/outbox-worker.js"]

volumes:
  localstack-data:
  opensearch-data:
  postgres-data:
